[project]
name = "verdikt-core"
version = "0.1.0"
description = "Proof-carrying operation for device agents: goal contracts and obligation ledgers that a checker proves against recorded UI evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "mcp>=2.2", "uvicorn>=0.30"]

[project.optional-dependencies]
ios = ["fb-idb>=1.1.7"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
verdikt-core = "verdikt_core.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
